<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<title>GazeCal · معايرة النظر</title>
<style>
:root {
  --bg: #0b0d10;
  --surface: #151a21;
  --surface-2: #1d242e;
  --line: #273140;
  --text: #e9eef5;
  --muted: #8b97a8;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --gaze: #60a5fa;
  --radius: 16px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 400 17px/1.5 -apple-system, "SF Arabic", "Segoe UI", system-ui, sans-serif;
  overscroll-behavior: none;
}

body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

[hidden] {
  display: none !important;
}

#app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

/* ---------- top bar ---------- */
#bar {
  flex: none;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px 0 16px;
  border-bottom: 1px solid var(--line);
}

#app.immersive #bar {
  display: none;
}

#bar h1 {
  flex: 1;
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#back {
  appearance: none;
  border: 0;
  background: none;
  color: var(--gaze);
  font: inherit;
  font-weight: 600;
  min-width: 44px;
  min-height: 44px;
  padding: 0 4px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chip::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
}

.chip.ok::before { background: var(--ok); }
.chip.warn::before { background: var(--warn); }
.chip.bad::before { background: var(--bad); }

/* ---------- screens ---------- */
#stage {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}

.screen.full {
  padding: 0;
  overflow: hidden;
  touch-action: none;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 16px;
}

.card h2 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 32px;
}

.row span { color: var(--muted); }

.row b {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: end;
}

.note {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.btn {
  appearance: none;
  border: 0;
  border-radius: 14px;
  min-height: 54px;
  width: 100%;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  text-align: start;
  flex: none;
}

.btn small {
  color: var(--muted);
  font-weight: 400;
  font-size: 14px;
}

.btn.primary {
  background: var(--ok);
  color: #06210f;
  justify-content: center;
}

.btn.primary small { color: #0b3d1e; }
.btn.danger { color: var(--bad); justify-content: center; }
.btn.center { justify-content: center; }
.btn:active { transform: scale(0.985); }
.btn[disabled] { opacity: 0.4; }

.btn-row {
  display: flex;
  gap: 10px;
}

.btn-row .btn {
  flex: 1;
  width: auto;
  min-width: 0;
}

.settings .row {
  min-height: 46px;
}

.switch {
  appearance: none;
  border: 0;
  flex: none;
  width: 52px;
  height: 32px;
  border-radius: 999px;
  background: var(--line);
  position: relative;
  transition: background 0.15s;
}

.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  inset-inline-start: 3px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s;
}

.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(-20px); }
[dir="ltr"] .switch[aria-checked="true"]::after { transform: translateX(20px); }

/* ---------- home ---------- */
.screen.home {
  overflow: hidden;
  padding-bottom: 0;
}

.status {
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
}

.status .rows {
  flex: 1;
  min-width: 0;
}

.status .row > * {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.slot {
  flex: none;
  width: 84px;
  height: 112px;
  border-radius: 12px;
  background: var(--surface-2);
}

.scroll {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

/* ---------- start overlay ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
}

/* Centred while it fits; starts at the top and scrolls when it does not. */
.overlay .inner {
  margin: auto 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.overlay .inner > * {
  flex: none;
}

.overlay h2 {
  margin: 0;
  font-size: 26px;
  line-height: 1.3;
  font-weight: 700;
}

.overlay ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--muted);
}

.overlay li {
  padding-inline-start: 18px;
  position: relative;
}

.overlay li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0.62em;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
}

.overlay .err {
  color: var(--bad);
  margin: 0;
}

.overlay .warn {
  color: var(--warn);
  margin: 0;
}

.btn.quiet {
  background: none;
  color: var(--muted);
  justify-content: center;
  min-height: 46px;
  font-weight: 400;
}

.overlay .detail {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
  direction: ltr;
  text-align: start;
  word-break: break-word;
}

.spinner {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid var(--line);
  border-top-color: var(--ok);
  animation: spin 0.8s linear infinite;
  flex: none;
}

.loading {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- camera preview ---------- */
#cam {
  position: fixed;
  left: 0;
  top: 0;
  width: 2px;
  height: 2px;
  opacity: 0.01;
  pointer-events: none;
  transform: scaleX(-1);
  object-fit: cover;
  z-index: 1;
}

#cam.thumb {
  opacity: 1;
  border-radius: 12px;
  background: var(--surface-2);
}

/* ---------- gaze cursor ---------- */
#cursor {
  --d: 120px;
  position: fixed;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  z-index: 60;
  pointer-events: none;
}

#cursor::after {
  content: "";
  position: absolute;
  width: var(--d);
  height: var(--d);
  margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  border-radius: 50%;
  border: 2px solid var(--gaze);
  background: rgba(96, 165, 250, 0.13);
}

#cursor::before {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--gaze);
}

/* ---------- calibration and test dots ---------- */
.dot {
  position: absolute;
  width: 76px;
  height: 76px;
  margin: -38px 0 0 -38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  touch-action: none;
}

.dot i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 5px rgba(74, 222, 128, 0.2);
}

.dot::after {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  border: 2px solid var(--ok);
  opacity: 0;
  animation: shrink 1.1s ease-out infinite;
}

@keyframes shrink {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(0.3); opacity: 0; }
}

.ghost {
  position: absolute;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  border-radius: 50%;
  border: 2px solid var(--gaze);
  pointer-events: none;
}

.ghost-line {
  position: absolute;
  height: 2px;
  background: var(--gaze);
  opacity: 0.6;
  transform-origin: 0 50%;
  pointer-events: none;
}

.hud {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--muted);
  pointer-events: none;
  padding: 0 24px;
}

.hud.hint { top: 28%; font-size: 18px; color: var(--text); }
.hud.prog { top: 66%; font-variant-numeric: tabular-nums; }

.close {
  appearance: none;
  border: 0;
  position: absolute;
  left: 6px;
  top: 6px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 18px;
  z-index: 5;
}

.sheet {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px 16px 16px;
  z-index: 6;
}

.sheet h2 {
  margin: 0;
  font-size: 20px;
}

.big {
  font-size: 34px;
  font-weight: 700;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.big small {
  font-size: 15px;
  font-weight: 400;
  color: var(--muted);
}

/* ---------- free-use screen ---------- */
.free {
  padding: 0;
  gap: 0;
  overflow: hidden;
  touch-action: none;
}

.free .top {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px 0;
}

.pill {
  appearance: none;
  border: 0;
  min-width: 84px;
  height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
}

.free .mid {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.code {
  direction: ltr;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 6px;
  font-variant-numeric: tabular-nums;
}

.typed {
  direction: ltr;
  min-height: 34px;
  font-size: 24px;
  letter-spacing: 6px;
  color: var(--ok);
  font-variant-numeric: tabular-nums;
}

.typed.wrong { color: var(--bad); }

.next {
  position: absolute;
  min-width: 96px;
  height: 48px;
  margin: -24px 0 0 -48px;
  border: 0;
  border-radius: 999px;
  background: var(--ok);
  color: #06210f;
  font: inherit;
  font-weight: 700;
}

.statline {
  padding: 8px 12px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.keys {
  direction: ltr;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 12px calc(14px + env(safe-area-inset-bottom));
}

.key {
  appearance: none;
  border: 0;
  height: 62px;
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-size: 24px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.key.fn {
  font-size: 16px;
  color: var(--muted);
}

.key:active,
.pill:active { background: var(--line); }

/* ---------- look + tap screen ---------- */
.pick {
  padding: 0;
  gap: 0;
  overflow: hidden;
  touch-action: none;
}

.pick .levels {
  display: flex;
  gap: 6px;
  padding: 8px 12px 8px 58px;
}

.seg {
  appearance: none;
  border: 0;
  flex: 1;
  height: 40px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--muted);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.seg[aria-pressed="true"] {
  background: var(--line);
  color: var(--text);
}

.grid {
  flex: 1;
  display: grid;
  gap: 8px;
  padding: 0 8px;
  direction: ltr;
}

.cell {
  border-radius: 14px;
  background: var(--surface);
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  transition: border-color 0.08s, background 0.08s;
}

.cell.goal::after {
  content: "";
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ok);
}

.cell.sel {
  border-color: var(--gaze);
  background: rgba(96, 165, 250, 0.16);
}

.cell.right { border-color: var(--ok); background: rgba(74, 222, 128, 0.2); }
.cell.wrong { border-color: var(--bad); background: rgba(248, 113, 113, 0.2); }

.pick .bottom {
  padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ---------- results ---------- */
.heat {
  direction: ltr;
  display: grid;
  gap: 4px;
  width: 168px;
  margin: 4px auto 0;
}

.heat div {
  aspect-ratio: 1 / 1.25;
  border-radius: 8px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 600;
  color: #0b0d10;
  font-variant-numeric: tabular-nums;
}

.heat div.empty { color: var(--muted); font-weight: 400; }

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 14px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.legend span {
  white-space: nowrap;
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-inline-end: 5px;
}

.curve {
  width: 100%;
  height: 120px;
  display: block;
  direction: ltr;
}

/* ---------- toast ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: calc(100% - 48px);
  padding: 10px 16px;
  border-radius: 12px;
  background: #2a3442;
  color: var(--text);
  font-size: 15px;
  text-align: center;
  z-index: 120;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

#toast.show { opacity: 1; }

/* ---- 0.2: follow-the-dot calibration, eye pictures, model board ---- */
.dot.moving { pointer-events: none; }
.dot.moving::after { display: none; }
.pbar {
  position: absolute;
  top: 0;
  left: 0;
  height: 3px;
  width: 0;
  background: var(--ok);
  opacity: 0.7;
  z-index: 4;
}
.hud.hint small {
  display: block;
  margin-top: 8px;
  font-size: 14px;
  color: var(--muted);
}
.status .row > .eyes {
  flex: none;
  line-height: 0;
  overflow: visible;
}
.eyes canvas {
  display: block;
  width: 96px;
  height: 24px;
  border-radius: 6px;
  background: #1c232d;
}
.tag {
  font-style: normal;
  font-size: 12px;
  color: #0b3d1e;
  background: var(--ok);
  border-radius: 999px;
  padding: 1px 8px;
  margin-inline-start: 6px;
  white-space: nowrap;
}

</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="back" type="button" data-gaze="ignore" hidden>رجوع</button>
    <h1 id="title">معايرة النظر</h1>
    <div id="chip" class="chip">…</div>
  </header>
  <main id="stage"></main>
</div>
<div id="cursor" hidden aria-hidden="true"></div>
<video id="cam" playsinline muted autoplay aria-hidden="true"></video>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">هذه الصفحة تحتاج JavaScript.</p></noscript>
<script type="module">
// src/engine.js
var clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function median(values) {
  if (!values || !values.length) return NaN;
  const a = Array.from(values).sort((x, y) => x - y);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function percentile(values, p) {
  if (!values || !values.length) return NaN;
  const a = Array.from(values).sort((x, y) => x - y);
  const idx = clamp((a.length - 1) * p, 0, a.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  return a[lo] + (a[hi] - a[lo]) * (idx - lo);
}
function solveSPD(A, B, n, m) {
  for (let j = 0; j < n; j++) {
    const rj = j * n;
    let d = A[rj + j];
    for (let k = 0; k < j; k++) d -= A[rj + k] * A[rj + k];
    if (!(d > 1e-12)) return false;
    d = Math.sqrt(d);
    A[rj + j] = d;
    for (let i = j + 1; i < n; i++) {
      const ri = i * n;
      let v = A[ri + j];
      for (let k = 0; k < j; k++) v -= A[ri + k] * A[rj + k];
      A[ri + j] = v / d;
    }
  }
  for (let c = 0; c < m; c++) {
    for (let i = 0; i < n; i++) {
      const ri = i * n;
      let v = B[i * m + c];
      for (let k = 0; k < i; k++) v -= A[ri + k] * B[k * m + c];
      B[i * m + c] = v / A[ri + i];
    }
    for (let i = n - 1; i >= 0; i--) {
      let v = B[i * m + c];
      for (let k = i + 1; k < n; k++) v -= A[k * n + i] * B[k * m + c];
      B[i * m + c] = v / A[i * n + i];
    }
  }
  return true;
}
function accumulate(A, B, z, w, y, m) {
  for (let r = 0; r < m; r++) {
    const wz = w * z[r];
    const row = r * m;
    for (let c = 0; c <= r; c++) A[row + c] += wz * z[c];
    B[r * 2] += wz * y[0];
    B[r * 2 + 1] += wz * y[1];
  }
}
var PACK_SCALE = 32;
function packInt8(values) {
  let s = "";
  for (let i = 0; i < values.length; i++) s += String.fromCharCode(clamp(Math.round(values[i] * PACK_SCALE), -127, 127) & 255);
  return btoa(s);
}
function unpackInt8(b642, out, offset = 0) {
  const s = atob(b642);
  for (let i = 0; i < s.length; i++) {
    const v = s.charCodeAt(i);
    out[offset + i] = (v > 127 ? v - 256 : v) / PACK_SCALE;
  }
  return s.length;
}
var FrameRing = class {
  constructor(maxAgeMs = 2500) {
    this.maxAgeMs = maxAgeMs;
    this.frames = [];
  }
  push(frame) {
    this.frames.push(frame);
    const cut = frame.t - this.maxAgeMs;
    while (this.frames.length && this.frames[0].t < cut) this.frames.shift();
  }
  window(t0, t1) {
    return this.frames.filter((f) => f.t >= t0 && f.t <= t1);
  }
};

function runDots(root, points, { src, force, onSample, onDone }) {
  let i = 0;
  let dot = null;
  let shownAt = 0;
  let stopped = false;
  const prog = $(".prog", root);
  function show() {
    if (stopped) return;
    if (i >= points.length) {
      prog.textContent = "";
      onDone();
      return;
    }
    const [x, y] = points[i];
    prog.textContent = `${i + 1} / ${points.length}`;
    dot = el('<div class="dot" data-gaze="dot"><i></i></div>');
    dot.style.left = `${x}px`;
    dot.style.top = `${y}px`;
    root.appendChild(dot);
    shownAt = performance.now();
    if (S.simUser) S.simUser.lookAt(x, y, shownAt);
    dot.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const t = eventTime(e);
      if (t - shownAt < 450) {
        toast("انظر إلى النقطة أولًا ثم المسها");
        return;
      }
      const rec = takeSample([x, y], src, t, 1, { force, since: shownAt + 250 });
      if (!rec.ok) {
        toast(rec.reason === "blink" ? "رمشت لحظة اللمس. أعد المحاولة" : "لا أرى وجهك بوضوح. عدّل وضعية الهاتف");
        return;
      }
      i++;
      dot.remove();
      dot = null;
      const wait = onSample ? onSample(rec, [x, y]) : 0;
      setTimeout(show, wait);
    });
  }
  show();
  return () => {
    stopped = true;
    if (dot) dot.remove();
  };
}

function learnPursuit(frames, path, tStart) {
  const usable = frames.filter((f) => f.face && f.phi && !(f.blink > 0.5) && f.t > 800);
  const out = { ok: false, usable: usable.length, total: frames.length };
  if (usable.length < 200) return out;
  const lag = estimateLag(usable, path, MODEL_SPECS.filter((m) => m.name === "B" || m.name === "D"));
  const samples = pursuitSamples(frames, path, { lagMs: lag.lagMs, wallT0: T0 + tStart });
  if (samples.length < 80) return out;
  S.cal.addBatch(samples, { nowT: Date.now() });
  S.cal.freeze();
  S.smooth.reset();
  S.pursuitLog.push({
    at: new Date(T0 + tStart).toISOString(),
    durationMs: PURSUIT_MS,
    path: { W: S.W, H: S.H, marginX: 0.1, marginY: 0.08, cyclesX: 5, cyclesY: 2, formula: "x = W/2 + W(0.5-marginX) sin(2π cyclesX u), y = H/2 + H(0.5-marginY) cos(2π cyclesY u), u = t/durationMs" },
    lagMs: lag.lagMs,
    lagSure: lag.sure,
    lagModel: lag.model,
    lagCurve: lag.curve.map((v) => Math.round(v * 10) / 10),
    samples: samples.length,
    // every frame keeps its features; every second one also keeps the larger eye picture
    frames: frames.map((f, i) => ({
      t: Math.round(f.t),
      k: Math.round(f.blink * 100) / 100,
      b: f.phi ? Array.from(f.phi.subarray(0, N_BASE), r5) : null,
      q: f.phi && f.phi.length > N_BASE ? packInt8(f.phi.subarray(N_BASE)) : null,
      e: f.hi && i % 2 === 0 ? b64(f.hi) : null
    }))
  });
  if (S.pursuitLog.length > 2) S.pursuitLog.shift();
  save();
  return { ...out, ok: S.cal.ready, n: samples.length, lag };
}

function testPoints(n) {
  const rand = mulberry32((Date.now() & 65535) + 1);
  const cols = 4;
  const rows = 5;
  const mx = 0.07 * S.W;
  const my = 0.07 * S.H;
  const cw = (S.W - 2 * mx) / cols;
  const ch = (S.H - 2 * my) / rows;
  const pts = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let x = mx + (c + 0.5 + (rand() - 0.5) * 0.5) * cw;
      const y = my + (r + 0.5 + (rand() - 0.5) * 0.5) * ch;
      if (x < 84 && y < 84) x = 84;
      pts.push([x, y]);
    }
  }
  return shuffle(pts, rand).slice(0, n);
}

      <div class="typed" id="f-typed"></div>
    </div>
    <div class="statline" id="f-stat"></div>
    <div class="keys">
      ${digits.map((k) => `<button class="key" data-gaze="target" data-k="${k}">${k}</button>`).join("")}
      <button class="key fn" data-gaze="target" data-k="del">حذف</button>
      <button class="key" data-gaze="target" data-k="0">0</button>
      <button class="key fn" data-gaze="target" data-k="ok">تم</button>
    </div>
  </section>`);
  const codeEl = $("#f-code", root);
  const typedEl = $("#f-typed", root);
  const labelEl = $("#f-label", root);
  const mid = $(".mid", root);
  let code = "";
  let typed = "";
  let done = 0;
  let nextBtn = null;
  function stat() {
    const scored = S.log.filter((r) => r.ok && r.err != null).slice(-12);
    const frozen = scored.filter((r) => r.frozenErr != null).map((r) => r.frozenErr);
    const parts = [`العينات ${S.cal.samples.length}`];
    if (scored.length) parts.push(`الخطأ ${cm(median(scored.map((r) => r.err)))} سم`);
    if (frozen.length && S.cal.learning) parts.push(`بلا تعلّم ${cm(median(frozen))} سم`);
    if (done) parts.push(`أرقام ${done}`);
    $("#f-stat", root).textContent = parts.join(" · ");
  }
  function fresh() {
    if (nextBtn) {
      nextBtn.remove();
      nextBtn = null;
    }
    code = Array.from({ length: 6 }, () => Math.floor(Math.random() * 10)).join("");
    typed = "";
    codeEl.hidden = false;
    codeEl.textContent = code;
    typedEl.textContent = "";
    typedEl.classList.remove("wrong");
    labelEl.hidden = false;
    labelEl.textContent = "اكتب هذا الرقم ثم اضغط «تم»";
  }
  function success() {
    done++;
    codeEl.hidden = true;
    typedEl.textContent = "";
    labelEl.hidden = true;
    nextBtn = el('<button class="next" data-gaze="target">التالي</button>');
    nextBtn.style.left = `${(0.2 + 0.6 * Math.random()) * mid.clientWidth}px`;
    nextBtn.style.top = `${(0.25 + 0.6 * Math.random()) * mid.clientHeight}px`;
    nextBtn.addEventListener("click", fresh);
    mid.appendChild(nextBtn);
  }
  root.addEventListener("click", (e) => {
    const key = e.target.closest("[data-k]");
    const act = e.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "new") fresh();
      else if (!nextBtn) {
        typed = "";
        typedEl.textContent = "";
        typedEl.classList.remove("wrong");
      }
      return;
    }
    if (!key || nextBtn) return;
    const k = key.dataset.k;
    typedEl.classList.remove("wrong");
    if (k === "del") typed = typed.slice(0, -1);
    else if (k === "ok") {
      if (typed === code) return success();
      typedEl.classList.add("wrong");
      labelEl.textContent = typed.length < 6 ? "الرقم ناقص" : "غير مطابق. صحّحه ثم اضغط «تم»";
    } else if (typed.length < 6) typed += k;
    typedEl.textContent = typed;
  });
  S.onSample = stat;
  fresh();
  stat();
  return root;
}
function pick() {
  const levels = [[2, 3], [3, 4], [3, 5]];
  const root = el(`<section class="screen pick">
    <button class="close" data-gaze="ignore" data-go="home" aria-label="إغلاق">✕</button>
    <div class="levels">${levels.map((l, i) => `<button class="seg" data-gaze="ignore" data-l="${i}">${targetsLabel(l[0] * l[1])}</button>`).join("")}</div>
    <div class="grid"></div>
    <div class="bottom">
      <div class="statline" id="p-stat"></div>
      <button class="btn primary" data-gaze="ignore" id="p-go">اختر</button>
    </div>
  </section>`);
  const grid = $(".grid", root);
  let cells = [];
  let rects = [];
  let goal = -1;
  let t0 = 0;
  let busy = true;
  let alive = true;
  function stat() {
    const [c, r] = levels[S.pickLevel];
    const mine = S.picks.filter((p) => p.cols === c && p.rows === r);
    if (!mine.length) {
      $("#p-stat", root).textContent = "انظر إلى المربع الذي فيه الدائرة ثم اضغط «اختر»";
      return;
    }
    const ok = mine.filter((p) => p.ok).length;
    const sec = median(mine.map((p) => p.ms)) / 1e3;
    $("#p-stat", root).textContent = `صحيح ${ok} من ${mine.length} · ${sec.toFixed(1)} ث للاختيار`;
  }
  function trial() {
    if (!alive) return;
    cells.forEach((c) => c.className = "cell");
    let g = goal;
    while (g === goal) g = Math.floor(Math.random() * cells.length);
    goal = g;
    cells[goal].classList.add("goal");
    S.selector.setTargets(rects);
    t0 = performance.now();
    if (S.simUser) S.simUser.lookAt(rects[goal].cx, rects[goal].cy, t0);
    busy = false;
  }
  function build() {
    busy = true;
    const [c, r] = levels[S.pickLevel];
    grid.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${r}, 1fr)`;
    grid.innerHTML = Array.from({ length: c * r }, () => '<div class="cell"></div>').join("");
    cells = Array.from(grid.children);
    root.querySelectorAll(".seg").forEach((s, i) => s.setAttribute("aria-pressed", String(i === S.pickLevel)));
    goal = -1;
    stat();
    requestAnimationFrame(() => {
      if (!alive) return;
      rects = cells.map((cell, i) => {
        const b = cell.getBoundingClientRect();
        return { id: i, cx: b.left + b.width / 2, cy: b.top + b.height / 2, w: b.width, h: b.height };
      });
      S.selector = new TargetSelector();
      trial();
    });
  }
  root.querySelectorAll(".seg").forEach((s) => s.addEventListener("click", () => {
    S.pickLevel = Number(s.dataset.l);
    build();
  }));
  $("#p-go", root).addEventListener("click", () => {
    if (busy) return;
    const best = S.gaze && S.selector ? S.selector.best() : null;
    if (!best) {
      toast("لا أرى عينيك الآن");
      return;
    }
    busy = true;
    const [c, r] = levels[S.pickLevel];
    const ok = best.index === goal;
    S.picks.push({ t: Date.now(), cols: c, rows: r, ok, ms: Math.round(performance.now() - t0), p: +best.p.toFixed(2), sigma: Math.round(sigmaPx()) });
    cells.forEach((cell) => cell.classList.remove("sel"));
    cells[best.index].classList.add(ok ? "right" : "wrong");
    stat();
    setTimeout(trial, 600);
  });
  S.onGaze = () => {
    if (busy || !S.selector) return;
    const best = S.gaze ? S.selector.best() : null;
    for (let i = 0; i < cells.length; i++) cells[i].classList.toggle("sel", !!best && best.index === i);
  };
  S.cleanup = () => {
    alive = false;
  };
  build();
  return root;
}
function summary() {
  const scored = S.log.filter((r) => r.ok && r.err != null && r.src !== "bootstrap");
  const last = scored.slice(-20);
  const frozen = last.filter((r) => r.frozenErr != null).map((r) => r.frozenErr);
  const bySrc = {};
  for (const r of S.log) if (r.ok) bySrc[r.src] = (bySrc[r.src] || 0) + 1;
  return {
    samples: S.cal.samples.length,
    scored: scored.length,
    medErrPx: median(last.map((r) => r.err)),
    medFrozenPx: median(frozen),
    medDxPx: median(last.map((r) => Math.abs(r.pred[0] - r.target[0]))),
    medDyPx: median(last.map((r) => Math.abs(r.pred[1] - r.target[1]))),
    p75Px: percentile(last.map((r) => r.err), 0.75),
    looPx: S.looPx,
    bySrc,
    pursuit: S.cal.samples.filter((x) => x.src === "pursuit").length,
    models: modelBoard(last).map((b) => ({ name: b.name, n: b.n, medPx: b.med, lead: b.lead, ready: b.ready })),
    lead: S.cal.activeModel() ? S.cal.activeModel().name : null,
    rejects: { ...S.rejects },
    fps: Math.round(S.fps)
  };
}
function pickSummary() {
  const groups = {};
  for (const p of S.picks) {
    const k = targetsLabel(p.cols * p.rows);
    groups[k] = groups[k] || { n: 0, ok: 0 };
    groups[k].n++;
    if (p.ok) groups[k].ok++;
  }
  return groups;
}
function summaryText() {
  const s = summary();
  const picks = Object.entries(pickSummary()).map(([k, g]) => `${k}: ${g.ok}/${g.n}`).join(" · ");
  const srcNames = { bootstrap: "9 نقاط", "test-dot": "نقاط القياس", "touch-target": "لمس أهداف", "touch-free": "لمس حر" };
  return [
    `GazeCal web ${VERSION}${S.sim ? " (محاكاة)" : ""}`,
    `الشاشة ${S.W}×${S.H} · DPR ${window.devicePixelRatio || 1} · ${s.fps} إطار/ث · ${S.delegate}`,
    `الكاميرا ${S.video ? `${S.video.w}×${S.video.h}` : "—"}`,
    `عينات المعايرة: ${s.samples} (${[...s.pursuit ? [`تتبّع ${s.pursuit}`] : [], ...Object.entries(s.bySrc).map(([k, v]) => `${srcNames[k] || k} ${v}`)].join("، ") || "—"})`,
    `مرفوضة: رمش ${s.rejects.blink || 0}، بلا وجه ${s.rejects["no-face"] || 0}`,
    `تقدير بعد 9 نقاط: ${cm(s.looPx)} سم`,
    `الخطأ الوسيط (آخر ${Math.min(20, s.scored)}): ${cm(s.medErrPx)} سم · بالمعايرة وحدها: ${cm(s.medFrozenPx)} سم`,
    `النماذج على العينات نفسها (سم): ${s.models.filter((m) => m.n).map((m) => `${m.name} ${cm(m.medPx)}`).join(" · ") || "—"} · يقود ${s.lead || "—"}`,
    `أفقي / عمودي: ${cm(s.medDxPx)} / ${cm(s.medDyPx)} سم · الربع الأسوأ فوق ${cm(s.p75Px)} سم`,
    `نظر + لمس: ${picks || "—"}`,
    `(${S.pxPerCm} px لكل سم، تقدير)`
  ].join("\n");
}
function rolling(values, k = 8) {
  return values.map((_, i) => median(values.slice(Math.max(0, i - k + 1), i + 1)));
}
function curveSvg() {
  const scored = S.log.filter((r) => r.ok && r.err != null && r.src !== "bootstrap");
  if (scored.length < 3) return '<p class="note">يظهر المنحنى بعد 3 عينات مقيسة على الأقل.</p>';
  const a = rolling(scored.map((r) => r.err / S.pxPerCm));
  const f = rolling(scored.map((r) => (r.frozenErr != null ? r.frozenErr : r.err) / S.pxPerCm));
  const top = Math.max(1, Math.ceil(Math.max(...a, ...f)));
  const Wd = 300;
  const Hd = 120;
  const pad = 6;
  const pts = (arr) => arr.map((v, i) => `${(pad + i / (arr.length - 1) * (Wd - 2 * pad)).toFixed(1)},${(Hd - pad - v / top * (Hd - 2 * pad)).toFixed(1)}`).join(" ");
  return `<svg class="curve" viewBox="0 0 ${Wd} ${Hd}" preserveAspectRatio="none" role="img" aria-label="منحنى الخطأ">
      <line x1="${pad}" y1="${Hd - pad}" x2="${Wd - pad}" y2="${Hd - pad}" stroke="#273140" stroke-width="1"/>
      <line x1="${pad}" y1="${pad}" x2="${Wd - pad}" y2="${pad}" stroke="#273140" stroke-width="1" stroke-dasharray="3 4"/>
      <polyline points="${pts(f)}" fill="none" stroke="#8b97a8" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
      <polyline points="${pts(a)}" fill="none" stroke="#60a5fa" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="legend"><span><i style="background:#60a5fa"></i>مع التعلّم</span><span><i style="background:#8b97a8"></i>المعايرة وحدها</span><span>أعلى الرسم = ${top} سم</span></div>`;
}
function heatHtml() {
  const color = (c) => c <= 1 ? "#4ade80" : c <= 2 ? "#fbbf24" : c <= 3 ? "#fb923c" : "#f87171";
  let html = `<div class="heat" style="grid-template-columns:repeat(${S.errMap.cols},1fr)">`;
  for (let r = 0; r < S.errMap.rows; r++) {
    for (let c = 0; c < S.errMap.cols; c++) {
      const cell = S.errMap.cell(c, r);
      html += cell.n ? `<div style="background:${color(cell.med / S.pxPerCm)}">${cm(cell.med)}</div>` : '<div class="empty">—</div>';
    }
  }
  return html + "</div>";
}
function stats() {

    <div class="card">
      <h2>الخطأ الحالي</h2>
      ${has ? `<div class="big">${cm(s.medErrPx)} <small>سم، وسيط آخر ${Math.min(20, s.scored)} عينة</small></div>
      <div class="row"><span>بالمعايرة وحدها</span><b>${cm(s.medFrozenPx)} سم</b></div>
      <div class="row"><span>أفقي / عمودي</span><b>${cm(s.medDxPx)} / ${cm(s.medDyPx)} سم</b></div>
      <div class="row"><span>أصغر هدف مريح</span><b>≈ ${cm(2 * s.p75Px)} سم</b></div>` : `<p class="note">لا قياسات بعد. أكمل المعايرة ثم «قياس الدقة» أو «استخدام حر».</p>`}
      <div class="row"><span>عينات المعايرة</span><b>${s.samples}</b></div>
      <div class="row"><span>مرفوضة (رمش / بلا وجه)</span><b>${s.rejects.blink || 0} / ${s.rejects["no-face"] || 0}</b></div>
    </div>
    <div class="card"><h2>بطولة النماذج</h2>
      ${s.models.map((m) => {
    const spec = S.cal.model(m.name);
    return `<div class="row"><span>${m.name} · ${spec.label}${m.lead ? ' <i class="tag">يقود</i>' : ""}</span><b>${m.n ? cm(m.medPx) + " سم" : m.ready ? "—" : "ينتظر عينات"}</b></div>`;
  }).join("")}
      <p class="note">كل عينة تُختبر على النماذج الأربعة قبل أن يتعلم منها أيٌّ منها. الأرقام وسيط آخر ${Math.min(20, s.scored)} عينة، والأقل خطأً يقود المؤشر.</p>
    </div>
    <div class="card"><h2>الخطأ مع توالي اللمسات (سم)</h2>${curveSvg()}</div>
    <div class="card"><h2>الخطأ حسب المنطقة (سم)</h2>${has ? heatHtml() : '<p class="note">تظهر الخريطة بعد أول قياس.</p>'}</div>
    <div class="card"><h2>نظر + لمس</h2>${Object.keys(picks).length ? Object.entries(picks).map(([k, g]) => `<div class="row"><span>${k}</span><b>${g.ok} من ${g.n}</b></div>`).join("") : '<p class="note">لا محاولات بعد.</p>'}</div>
    <button class="btn center" id="s-copy">نسخ الملخص</button>
    <button class="btn center" id="s-dl">تنزيل السجل الكامل (JSON)</button>
    <button class="btn danger" id="s-reset">مسح المعايرة</button>
    <p class="note">السنتيمتر محسوب على ${S.pxPerCm} px لكل سم (تقدير لهذا الجهاز).</p>
  </section>`);
  $("#s-copy", root).addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(summaryText());

    } catch (e) {

    }
  });
  $("#s-dl", root).addEventListener("click", () => {
    const data = {
      app: `GazeCal web ${VERSION}`,
      when: (/* @__PURE__ */ new Date()).toISOString(),
      userAgent: navigator.userAgent,
      viewport: { w: S.W, h: S.H, dpr: window.devicePixelRatio || 1 },
      pxPerCm: S.pxPerCm,
      sim: S.sim,

      // rec.pix / frame.q: PIX_W×PIX_H values per eye (right then left), row by row, int8 = value×32 after

      eyeImages: { w: PIX_W, h: PIX_H, hiW: HI_W, hiH: HI_H, span: CROP_SPAN, encoding: "base64" },
      models: S.cal.leaderboard(),

      const a = document.createElement("a");

      document.body.appendChild(a);

      e.currentTarget.textContent = "اضغط مرة ثانية لتأكيد المسح";
      return;
    }
    S.cal.reset();
    S.errMap.reset();
    S.log = [];
    S.picks = [];

    S.looPx = NaN;

  });

}
var SCREENS = { home, boot, pursue, test, free, pick, stats };
var resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const turned = w !== S.W || h >= w !== S.H >= S.W;

window.__gazecal = { S, go, takeSample, summary, summaryText };
renderStart();
